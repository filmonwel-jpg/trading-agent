spring.application.name=trading-agent
server.address=0.0.0.0
logging.file.name=runtime/trading-agent-${trading.symbol:TSLA}.log
spring.config.import=optional:file:runtime/postgres-local.properties

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/trading_agent
spring.datasource.username=trading_agent_databento
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=0

trading.host=127.0.0.1
trading.port=7497
trading.client-id=1
trading.ibkr.shared-gateway.enabled=false
trading.ibkr.shared-gateway.host=127.0.0.1
trading.ibkr.shared-gateway.port=9910
trading.ibkr.shared-gateway.connect-timeout-ms=3000
trading.ibkr.shared-gateway.ack-timeout-ms=5000
trading.ibkr.shared-gateway.skip-direct-connection=false
trading.market-data.provider=ibkr

# Strategy tuning (active: SPY)
# trading.symbol=SPY
# trading.gap-percentage=0.001
# trading.reversal-percentage=0.0002
# trading.max-volatility-percent=0.0015

# SHOP preset (uncomment to switch)
trading.symbol=TSLA
trading.gap-percentage=0.0025
trading.reversal-percentage=0.001
trading.max-volatility-percent=10.0

trading.trade-amount=5000
trading.max-trades=12
trading.regime.auto-enabled=true
trading.regime.window-ticks=12
trading.rsi.period=60
trading.stop-loss-percentage=0.004
trading.max-daily-drawdown=5000
trading.post-hard-stop-entry-cooldown-ms=300000
trading.max-hard-stops-per-day=3
trading.regime.min-directional-move=1.20
trading.regime.trend-strength-threshold=0.70
trading.ai.long-entry-threshold=0.68
trading.ai.short-entry-threshold=0.63
trading.ai.long-exit-threshold=0.58
trading.ai.short-exit-threshold=0.60
trading.ai.regime-threshold=0.50
trading.ai.entry-threshold-raise-percent=10.0
trading.ai.open30.long-entry-threshold=0.68
trading.ai.open30.short-entry-threshold=0.63
trading.ai.open30.long-exit-threshold=0.58
trading.ai.open30.short-exit-threshold=0.60
trading.ai.regime.choppy.long-entry-threshold=0.68
trading.ai.regime.choppy.short-entry-threshold=0.63
trading.ai.regime.choppy.long-exit-threshold=0.58
trading.ai.regime.choppy.short-exit-threshold=0.60
trading.ai.regime.trend.long-entry-threshold=0.68
trading.ai.regime.trend.short-entry-threshold=0.63
trading.ai.regime.trend.long-exit-threshold=0.58
trading.ai.regime.trend.short-exit-threshold=0.60
trading.ai.regime.volatile.long-entry-threshold=0.68
trading.ai.regime.volatile.short-entry-threshold=0.63
trading.ai.regime.volatile.long-exit-threshold=0.58
trading.ai.regime.volatile.short-exit-threshold=0.60
trading.market-data-request-id=1001
trading.model.dir=runtime/models/${trading.symbol}
trading.databento.python-bin=/Users/filmonghezehey/miniforge3/bin/python3
trading.databento.normalizer-script=scripts/databento_live_normalizer.py
trading.databento.env-file=runtime/databento.env
trading.databento.live-gateway=
trading.databento.equity-dataset=EQUS.MINI
trading.databento.equity-schema=tbbo
trading.databento.options-dataset=OPRA.PILLAR
trading.databento.options-schema=ohlcv-1s
trading.databento.option-parents=${trading.symbol}.OPT
trading.databento.heartbeat-seconds=15
trading.databento.startup-delay-seconds=40
trading.databento.shared-feed.startup-history-seconds=0
trading.databento.shared-feed.enabled=true
trading.databento.shared-feed.host=127.0.0.1
trading.databento.shared-feed.port=9800
trading.databento.shared-feed.shard-id=0
trading.databento.shared-feed.start-if-missing=true
trading.databento.shared-feed.fallback-to-private-sidecar=false
trading.databento.shared-feed.start-timeout-ms=15000
trading.databento.shared-feed.expected-client-count=1
trading.databento.shared-feed.client-wait-timeout-ms=15000
trading.databento.shared-feed.script=scripts/databento_shared_feed_relay.py
trading.databento.shared-feed.bots-dir=runtime/databento/bots
trading.databento.shared-feed.lock-file=runtime/databento/shared-feed-relay-shard0.lock
trading.databento.shared-feed.pid-file=runtime/databento/shared-feed-relay-shard0.pid
trading.databento.shared-feed.log-file=runtime/databento/logs/databento-shared-feed-relay-shard0.log
trading.databento.auto-restart.enabled=true
trading.databento.restart-delay-ms=2000
trading.databento.restart-jitter-ms=2500
trading.databento.max-silence-ms=120000
trading.databento.quote-stale-threshold-ms=5000
trading.databento.allow-stale-closing-market-order=true
trading.databento.model-routing-csv=runtime/databento/model-routing.csv
trading.databento.symbol-plan-csv=training_data/databento_30s/symbol_model_plan.csv
trading.databento.api.key=
trading.databento.api.userid=
trading.scanner.enabled=false
trading.scanner.request-id=7001
trading.scanner.instrument=STK
trading.scanner.location=STK.US.MAJOR
trading.scanner.scan-code=HOT_BY_VOLUME
trading.scanner.max-results=10
trading.scanner.require-distance=true
trading.scanner.min-abs-distance=0.20
trading.scanner.max-abs-distance=2.50
trading.scanner.prefer-low-distance=true
trading.scanner.switch-min-interval-ms=120000

trading.reconnect.max-attempts=5
trading.reconnect.delay-ms=3000

trading.risk.enabled=true
trading.risk.max-order-notional=5000
trading.risk.max-daily-orders=1000
trading.risk.max-share-cap=500
trading.shared-capital.enabled=false
trading.shared-capital.file=runtime/shared-capital.properties
trading.shared-capital.total-notional=70000
trading.risk.window-start=09:30
trading.risk.window-end=14:00
trading.kill-switch=false

trading.state.file=runtime/trader-state-${trading.symbol}.properties
trading.log.file=runtime/trades-${trading.symbol}.csv
trading.log.storage-mode=both

trading.state.force-enabled-on-start=true
trading.orders.stale-timeout-ms=15000

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.diskspace.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=trading-agent
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET,POST,OPTIONS

# Custom Health Check Configuration
management.health.trading.enabled=true
management.health.ibkr.enabled=true
management.health.databento.enabled=true
